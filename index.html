<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SimplyDoors">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Professional Measurement Tool for SimplyDoors">
<title>SimplyDoors Measure App</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    /* =========================================
       1. VARIABLES & RESET
       ========================================= */
    :root {
        --brand-green: #7bc043;
        --brand-dark: #2c3e50;
        --brand-bg: #f4f7f6;
        --brand-white: #ffffff;
        --ui-blue: #007bff;
        --ui-danger: #dc3545;
        --shadow-card: 0 4px 20px rgba(0,0,0,0.06);
        --radius: 12px;
        --alert-red: #ff0000;
        --gray-container: #f8f9fa;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        background-color: var(--brand-bg);
        margin: 0; padding: 0; 
        padding-top: env(safe-area-inset-top);
        padding-bottom: 160px; 
        color: #333;
    }

    .main-wrapper { padding: 15px; max-width: 850px; margin: 0 auto; }
    .container { 
        background: var(--brand-white); border-radius: var(--radius); 
        box-shadow: var(--shadow-card); overflow: hidden; min-height: 80vh; padding-bottom: 40px;
    }

    /* =========================================
       2. HEADER
       ========================================= */
    .app-header {
        background: var(--brand-white);
        padding-top: calc(15px + env(safe-area-inset-top)); 
        padding-bottom: 20px; padding-left: 20px; padding-right: 20px;
        text-align: center;
        box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        border-bottom: 4px solid var(--brand-green);
        position: sticky; top: 0; z-index: 900;
    }
    .logo-container img { height: 55px; width: auto; display: inline-block; }
    .logo-text { font-size: 28px; font-weight: 800; color: var(--brand-dark); display: none; letter-spacing: -0.5px; line-height: 1; }
    .logo-text span { color: var(--brand-green); }
    .app-subtitle { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #999; margin-top: 6px; }

    /* =========================================
       3. UI COMPONENTS
       ========================================= */
    /* Modal */
    .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        z-index: 2000; display: none; align-items: center; justify-content: center;
    }
    .modal-box {
        background: white; width: 90%; max-width: 400px; padding: 30px; 
        border-radius: 16px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: var(--brand-dark); }
    .modal-btn-row { display: flex; gap: 15px; }
    .modal-btn {
        flex: 1; padding: 20px; border-radius: 12px; border: 2px solid #eee;
        background: #f8f9fa; font-size: 16px; font-weight: 700; cursor: pointer;
        transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .modal-btn:active { transform: scale(0.95); }
    .modal-btn.is-door { color: var(--brand-green); border-color: var(--brand-green); background: #f0fff4; }
    .modal-btn.is-door svg { width: 30px; height: 30px; fill: var(--brand-green); }
    .modal-btn.is-window { color: var(--ui-blue); border-color: var(--ui-blue); background: #f0f7ff; }
    .modal-btn.is-window svg { width: 30px; height: 30px; fill: var(--ui-blue); }

    /* Save Toast */
    .save-indicator {
        position: fixed; top: 20px; right: 20px; font-size: 12px; font-weight: 700;
        background: var(--brand-green); color: white; padding: 8px 16px; border-radius: 30px;
        opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;
        margin-top: env(safe-area-inset-top); 
    }
    .save-indicator.error { background: var(--ui-danger); }

    .empty-state {
        text-align: center; padding: 60px 20px; color: #a0aec0;
        border: 2px dashed #e2e8f0; border-radius: 12px; margin: 20px; background: #fafbfc;
    }
    
    /* Inputs */
    .section { padding: 25px 20px; border-bottom: 1px solid #f0f0f0; }
    .section-title { font-size: 14px; color: var(--brand-dark); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 15px; margin-top: 10px; }
    .row { display: flex; gap: 15px; align-items: flex-end; }
    .col { flex: 1; min-width: 0; }
    label { display: block; margin-top: 18px; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input:not([type="checkbox"]), select, textarea { 
        width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px;
        font-size: 16px; background: #fff; color: #2d3748; -webkit-appearance: none; appearance: none; 
    }
    select:invalid, select option[value=""] { color: var(--ui-blue); font-weight: 600; }
    textarea { resize: vertical; min-height: 80px; line-height: 1.4; }
    .sub-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #a0aec0; margin-bottom: 4px; display: block; }

    /* Composite Input (Mobile Fix) */
    .composite-input { display: flex; align-items: center; width: 100%; }
    .composite-input input { 
        border-top-right-radius: 0; border-bottom-right-radius: 0; 
        flex: 1.5; min-width: 0; z-index: 2; 
    }
    .composite-input select { 
        border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; 
        background-color: #f8f9fa; font-weight: 500; text-align: center; 
        flex: 1; min-width: 65px; padding-left: 5px; padding-right: 5px;
    }

    /* Custom Toggles */
    .toggle-wrapper { position: relative; width: 100%; }
    .custom-input-group { display: flex; gap: 8px; align-items: center; }
    .undo-btn { background: #edf2f7; color: #718096; border: none; width: 46px; height: 48px; border-radius: 8px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    
    /* Checklist */
    .checklist-container { background-color: var(--gray-container); border-radius: 10px; padding: 10px 15px; margin-top: 5px; border: 1px solid #edf2f7; }
    .checklist-item { display: flex; align-items: center; padding: 12px 0; cursor: pointer; user-select: none; }
    .checklist-item.active .custom-checkbox { background-color: #333; border-color: #333; }
    .checklist-item.active .custom-checkbox::after { content: '✓'; color: white; font-size: 18px; font-weight: 800; }
    .custom-checkbox { width: 24px; height: 24px; border: 2px solid #ccc; border-radius: 6px; margin-right: 12px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .checklist-text { font-size: 14px; font-weight: 600; color: #555; }

    /* Tempered Toggle */
    .win-toggle-wrap { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    .win-switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .win-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--alert-red); }
    input:checked + .slider:before { transform: translateX(22px); }
    .win-toggle-label { font-size: 11px; font-weight: 800; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    .win-toggle-wrap.is-tempered .win-toggle-label { color: var(--alert-red); }

    /* Dynamic Rows */
    .measure-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end; }
    .remove-row { color: #e53e3e; font-weight: bold; padding: 10px; cursor: pointer; font-size: 20px; }
    .btn-add-point { background: none; border: 2px dashed #cbd5e0; width: 100%; padding: 10px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 5px; color: #555; }

    /* Photos */
    .photo-grid { display: flex; gap: 10px; margin-top: 10px; }
    .photo-box {
        flex: 1; height: 100px; border: 2px dashed #cbd5e0; border-radius: 10px;
        background-color: #f7fafc; display: flex; align-items: center; justify-content: center;
        cursor: pointer; position: relative; overflow: hidden;
    }
    .photo-box.has-image { border: 2px solid var(--brand-green); background-color: #fff; }
    .photo-box input[type="file"] { display: none; }
    .photo-placeholder { text-align: center; font-size: 11px; font-weight: 600; color: #718096; pointer-events: none; }
    .photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
    .photo-spinner { display: none; border: 3px solid #f3f3f3; border-top: 3px solid var(--brand-green); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Cards */
    .measure-card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
        padding: 25px; margin-bottom: 30px; position: relative;
        box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }
    .measure-card[data-type="door"] { border-left: 6px solid var(--brand-green); }
    .measure-card[data-type="window"] { border-left: 6px solid var(--ui-blue); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card-badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; color: white; }
    .measure-card[data-type="door"] .card-badge { background: var(--brand-green); }
    .measure-card[data-type="window"] .card-badge { background: var(--ui-blue); }
    .btn-delete { background: #fff1f2; color: #e53e3e; border: none; width: 36px; height: 36px; border-radius: 50%; font-weight: bold; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pdf-brand { display: none; }

    /* Footer Buttons */
    .btn-group { 
        padding: 15px 20px; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
        position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid #e2e8f0; 
        box-shadow: 0 -4px 25px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 10px;
        z-index: 999; padding-bottom: calc(15px + env(safe-area-inset-bottom));
    }
    button.action-btn { 
        flex: 1; padding: 16px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; 
        cursor: pointer; color: white; text-align: center; min-width: 100px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: transform 0.1s;
    }
    button.action-btn:active { transform: scale(0.98); }
    .btn-add { background-color: var(--brand-dark); } 
    .btn-dup { background-color: #6f42c1; } 
    .btn-print { background-color: var(--ui-blue); } 
    .btn-reset { background-color: var(--ui-danger); flex-basis: 100%; margin-top: 5px; opacity: 0.9; font-size: 13px; padding: 12px; }

    /* =========================================
       4. PRINTING MODE (PDF ENGINE)
       ========================================= */
    .printing-mode body { background: white; margin: 0; padding: 0 !important; }
    .printing-mode .main-wrapper { padding: 0; width: 750px; margin: 0 auto; }
    .printing-mode .container { box-shadow: none; border: none; border-radius: 0; padding: 0; min-height: auto; }
    
    /* Hide UI */
    .printing-mode .btn-group, .printing-mode .btn-delete, .printing-mode .save-indicator, 
    .printing-mode .undo-btn, .printing-mode .app-header, .printing-mode .btn-add-point, 
    .printing-mode .remove-row, .printing-mode .empty-state, .printing-mode .modal-overlay { display: none !important; }

    /* Cover Page */
    .printing-mode .job-cover-page {
        display: block; width: 100%; padding: 40px;
        page-break-after: always; break-after: page; border-bottom: none;
    }
    .printing-mode .cover-header { 
        text-align: center; margin-bottom: 40px; 
        border-bottom: 4px solid var(--brand-green); padding-bottom: 20px;
    }
    .printing-mode .cover-header h1 { font-size: 42px; color: var(--brand-dark); margin: 0; }
    .printing-mode .cover-header p { font-size: 16px; color: #666; text-transform: uppercase; letter-spacing: 4px; margin-top: 5px; }
    .printing-mode .cover-box { border: 2px solid #333; padding: 25px; border-radius: 8px; background: #fff; margin-bottom: 30px; }
    
    /* Dynamic Tech Info in PDF */
    .printing-mode .tech-info-print {
        margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc;
        font-size: 13px; line-height: 1.6; color: #444;
    }
    .printing-mode .tech-info-print strong { color: var(--brand-dark); }

    /* Card Layout for PDF - NO BLEEDING */
    .printing-mode .measure-card {
        box-shadow: none; border: 2px solid #333; margin: 0; padding: 40px; 
        margin-bottom: 20px;
        display: block; 
        page-break-inside: avoid !important; 
        break-inside: avoid !important;
    }
    .printing-mode .pdf-brand { 
        display: block; text-align: right; color: #aaa; font-size: 12px; 
        text-transform: uppercase; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px;
    }
    
    /* Print Inputs */
    .printing-mode label { margin-top: 15px; font-size: 12px; color: #666; text-transform: uppercase; }
    .printing-mode input, .printing-mode select {
        border: none; border-bottom: 1px solid #000; border-radius: 0; padding: 6px 0; 
        font-weight: 700; font-size: 14px; background: transparent; color: #000; margin-bottom: 5px;
    }
    .printing-mode textarea { border: 1px solid #ddd; padding: 10px; font-size: 12px; margin-top: 5px; }
    
    .printing-mode .composite-input select { width: auto; min-width: 50px; margin-left: 5px; }
    .printing-mode .checklist-container { background: transparent; border: none; padding: 0; margin-top: 15px;}
    .printing-mode .checklist-item:not(.active) { display: none; }
    .printing-mode .checklist-item { padding: 4px 0; }
    .printing-mode .custom-checkbox { border: none; width: auto; background: transparent; margin-right: 8px; }
    .printing-mode .custom-checkbox:after { content: "☑"; color: black; font-size: 18px; }
    .printing-mode .photo-box { border: 1px solid #000; flex: 0 0 32%; height: 200px; background: #fff; }
    .printing-mode .photo-box:not(.has-image) { opacity: 0.2; border: 1px dashed #ccc; }
    .printing-mode .tempered-print-only { display: block !important; font-weight: 900; color: var(--alert-red); border: 3px solid var(--alert-red); padding: 10px; text-align: center; margin-top: 20px; font-size: 16px; }
    .printing-mode .win-switch, .printing-mode .slider, .signature-line { display: none; }
</style>
</head>
<body>

<header class="app-header">
    <div class="logo-container">
        <img src="logo.png" alt="SimplyDoors" onerror="this.style.display='none'; document.querySelector('.logo-text').style.display='block';">
        <div class="logo-text">Simply<span>Doors</span></div>
    </div>
    <div class="app-subtitle">SimplyDoors Measure App</div>
</header>

<div class="save-indicator" id="saveMsg">Saved</div>

<div class="modal-overlay" id="typeModal" onclick="closeModal(event)">
    <div class="modal-box">
        <div class="modal-title">Select Item Type</div>
        <div class="modal-btn-row">
            <div class="modal-btn is-door" onclick="selectType('door')">
                <svg
